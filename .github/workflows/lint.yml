name: kb-lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  kb-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tool/kb lint
      - run: pip install pytest && python3 -m pytest -q tool/tests/
